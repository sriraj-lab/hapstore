name: tests

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m build

  pgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,pgen]"
      - run: pytest tests/test_pgen_ingest.py tests/test_pgen_export.py tests/test_export.py -q

  plink2-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: plink
          create-args: >-
            python=3.11 plink2=2.00a5.12
            -c conda-forge -c bioconda
      - run: micromamba run -n plink python -m pip install --upgrade pip
      - run: micromamba run -n plink python -m pip install -e ".[dev,pgen]"
      - run: micromamba run -n plink plink2 --version
      - run: micromamba run -n plink pytest tests/test_ingest.py::test_ingest_vcf_plink2_bridge_backfills_genetic_positions -q

  tagged-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: >-
          python -c "import os, tomllib; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; tag = os.environ['GITHUB_REF_NAME']; assert tag == f'v{version}', f'tag {tag} does not match package version {version}'"
